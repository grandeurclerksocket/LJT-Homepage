name: Verify Jekyll build (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check generated pages and content
        run: |
          set -e
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/publication/synlogic.html
          test -f _site/publication/ceval.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "HKUST NLP Group" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "EMNLP 2024" _site/publications/index.html
          grep -q "NeurIPS 2023" _site/publications/index.html
          echo "All expected pages and content were generated."
